apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: meldekort-mikrofrontend
  namespace: meldekort
  labels:
    team: "meldekort"
    fagsystem: "dagpenger"
    domene: "meldekort"
    okonomisystem: "false"
spec:
  tokenx:
    enabled: true
  image: {{ image }}
  port: 3000
  liveness:
    path: /api/internal/isAlive
    initialDelay: 10
  readiness:
    path: /api/internal/isReady
    initialDelay: 10
  observability:
    logging:
      destinations:
        - id: loki
        - id: elastic
  replicas:
    min: 2
    max: 4
  accessPolicy:
    inbound:
      rules:
        - application: tms-min-side
          namespace: min-side
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: meldekort-api
        - application: dp-meldekort
          namespace: teamdagpenger
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: "20m"
      memory: 128Mi
  env:
    - name: MELDEKORT_API_AUDIENCE
      value: "prod-gcp:meldekort:meldekort-api"
    - name: MELDEKORT_API_URL
      value: "http://meldekort-api.meldekort/meldekort/meldekort-api/api/person/meldekortstatus"
    - name: DP_MELDEKORT_AUDIENCE
      value: "prod-gcp:teamdagpenger:dp-meldekort"
    - name: DP_MELDEKORT_URL
      value: "http://dp-meldekort.teamdagpenger/meldekortstatus"
    - name: MELDEKORT_URL
      value: "https://www.nav.no/felles-meldekort"
    - name: ETTERREGISTRERING_MELDEKORT_URL
      value: "https://www.nav.no/felles-meldekort/etterregistrer-meldekort"
    - name: DAGPENGER_MELDEKORT_URL
      value: "https://www.nav.no/arbeid/dagpenger/meldekort"
